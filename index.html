<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WSC 2026 — Are We There Yet? Crash Course</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --purple-bg: #EEEDFE; --purple-text: #3C3489; --purple-border: #AFA9EC;
    --teal-bg: #E1F5EE; --teal-text: #085041; --teal-border: #5DCAA5;
    --amber-bg: #FAEEDA; --amber-text: #633806; --amber-border: #EF9F27;
    --coral-bg: #FAECE7; --coral-text: #712B13; --coral-border: #F0997B;
    --pink-bg: #FBEAF0; --pink-text: #72243E; --pink-border: #ED93B1;
    --blue-bg: #E6F1FB; --blue-text: #0C447C; --blue-border: #85B7EB;
    --green-bg: #EAF3DE; --green-text: #27500A; --green-border: #97C459;
    --red-bg: #FCEBEB; --red-text: #791F1F; --red-border: #F09595;
    --gray-bg: #F1EFE8; --gray-text: #444441; --gray-border: #B4B2A9;
  }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f5f5f0; color: #222; line-height: 1.6; font-size: 15px; }
  .app { max-width: 820px; margin: 0 auto; padding: 1rem; }

  /* Header */
  .header { background: #fff; border-radius: 14px; border: 1px solid #e0ddd5; padding: 1.5rem; text-align: center; margin-bottom: 1rem; }
  .header h1 { font-size: 22px; font-weight: 600; color: #1a1a1a; }
  .header p { font-size: 14px; color: #666; margin-top: 6px; }
  .badges { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin-top: 12px; }
  .badge { font-size: 12px; padding: 4px 12px; border-radius: 20px; font-weight: 500; }
  .b-purple { background: var(--purple-bg); color: var(--purple-text); }
  .b-teal   { background: var(--teal-bg);   color: var(--teal-text); }
  .b-amber  { background: var(--amber-bg);  color: var(--amber-text); }
  .b-coral  { background: var(--coral-bg);  color: var(--coral-text); }

  /* Score bar */
  .score-bar { background: #fff; border-radius: 12px; border: 1px solid #e0ddd5; padding: 0.9rem 1.25rem; margin-bottom: 1rem; display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
  .score-label { font-size: 13px; color: #888; }
  .score-val { font-size: 20px; font-weight: 600; color: #1a1a1a; min-width: 60px; }
  .progress-track { flex: 1; min-width: 120px; height: 7px; background: #e5e2da; border-radius: 4px; overflow: hidden; }
  .progress-fill { height: 100%; background: #1D9E75; border-radius: 4px; transition: width 0.4s; width: 0%; }
  .acc-label { font-size: 13px; color: #888; }
  .acc-val { font-size: 15px; font-weight: 600; color: #1D9E75; }
  .reset-btn { margin-left: auto; padding: 7px 18px; font-size: 13px; border: 1px solid #ccc; border-radius: 20px; cursor: pointer; color: #555; background: #fff; transition: background .15s; }
  .reset-btn:hover { background: #f0ede8; }

  /* Tabs */
  .tab-bar { display: flex; flex-wrap: wrap; gap: 7px; margin-bottom: 1rem; }
  .tab { padding: 7px 15px; font-size: 13px; border: 1px solid #ddd; border-radius: 20px; cursor: pointer; color: #666; background: #fff; transition: all .15s; }
  .tab:hover { background: #f0ede8; }
  .tab.active { background: var(--purple-bg); border-color: var(--purple-border); color: var(--purple-text); font-weight: 600; }

  /* Section heading */
  .section-heading { font-size: 12px; font-weight: 600; color: #999; text-transform: uppercase; letter-spacing: .08em; margin: 1.25rem 0 0.6rem; padding-bottom: 6px; border-bottom: 1px solid #e5e2da; }

  /* Tip box */
  .tip-box { background: var(--purple-bg); border: 1px solid var(--purple-border); border-radius: 10px; padding: 1rem 1.25rem; margin-bottom: 1.25rem; font-size: 13.5px; color: var(--purple-text); line-height: 1.65; }
  .tip-box strong { font-weight: 600; }

  /* Question card */
  .q-block { background: #fff; border: 1px solid #e0ddd5; border-radius: 12px; padding: 1.2rem 1.25rem; margin-bottom: 0.9rem; }
  .q-meta { display: flex; gap: 8px; align-items: center; margin-bottom: 10px; }
  .q-num { font-size: 11px; color: #aaa; font-weight: 500; }
  .q-subj-tag { font-size: 11px; padding: 3px 9px; border-radius: 10px; font-weight: 500; }
  .q-text { font-size: 15px; font-weight: 500; color: #1a1a1a; line-height: 1.55; margin-bottom: 14px; }
  .options { display: flex; flex-direction: column; gap: 8px; }
  .opt { padding: 10px 14px; border: 1px solid #ddd; border-radius: 8px; cursor: pointer; font-size: 14px; color: #333; background: #fff; text-align: left; transition: all .15s; line-height: 1.4; font-family: inherit; }
  .opt:hover:not([disabled]) { background: #f5f3ee; border-color: #bbb; }
  .opt[disabled] { cursor: default; }
  .opt.correct { background: var(--green-bg); border-color: var(--green-border); color: var(--green-text); }
  .opt.wrong   { background: var(--red-bg);   border-color: var(--red-border);   color: var(--red-text); }
  .opt.reveal  { background: var(--teal-bg);  border-color: var(--teal-border);  color: var(--teal-text); }
  .explanation { margin-top: 12px; padding: 10px 14px; border-radius: 8px; font-size: 13px; color: #555; background: #f5f3ee; border-left: 3px solid #1D9E75; line-height: 1.6; display: none; }

  /* Mobile adjustments */
  @media (max-width: 600px) {
    .header h1 { font-size: 18px; }
    .score-bar { gap: 8px; }
    .score-val { font-size: 17px; }
    .q-text { font-size: 14px; }
    .opt { font-size: 13px; }
  }
</style>
</head>
<body>
<div class="app">

<div class="header">
  <h1>WSC 2026 — Are We There Yet? Crash Course</h1>
  <p>Super Junior category (born 2013 &amp; after) &nbsp;·&nbsp; Gurugram Regional Round</p>
  <div class="badges">
    <span class="badge b-purple">60 MCQs</span>
    <span class="badge b-teal">6 Subjects</span>
    <span class="badge b-amber">Scholar's Challenge style</span>
    <span class="badge b-coral">Instant feedback</span>
  </div>
</div>

<div class="score-bar">
  <span class="score-label">Score:</span>
  <span class="score-val" id="scoreVal">0 / 0</span>
  <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
  <span class="acc-label">Accuracy:</span>
  <span class="acc-val" id="accVal">—</span>
  <button class="reset-btn" onclick="resetAll()">Reset all</button>
</div>

<div class="tab-bar" id="tabBar"></div>
<div id="content"></div>

</div>
<script>
const SUBJECTS = [
  {id:'all',  label:'All questions'},
  {id:'hist', label:'History'},
  {id:'sci',  label:'Science & Tech'},
  {id:'lit',  label:'Literature & Media'},
  {id:'soc',  label:'Social Studies'},
  {id:'art',  label:'Art & Music'},
  {id:'spec', label:'Special Area'},
];

const SUBJ_STYLE = {
  hist:{ tag:'background:var(--amber-bg);color:var(--amber-text)', name:'History' },
  sci: { tag:'background:var(--teal-bg);color:var(--teal-text)',   name:'Science & Technology' },
  lit: { tag:'background:var(--coral-bg);color:var(--coral-text)', name:'Literature & Media' },
  soc: { tag:'background:var(--purple-bg);color:var(--purple-text)',name:'Social Studies' },
  art: { tag:'background:var(--pink-bg);color:var(--pink-text)',   name:'Art & Music' },
  spec:{ tag:'background:var(--blue-bg);color:var(--blue-text)',   name:'Special Area' },
};

const QS = [
  // HISTORY
  {id:1,s:'hist',q:"The phrase 'Are we there yet?' on a journey connects to which ancient explorer who thought he had reached Asia when he landed in the Americas?",o:["Christopher Columbus","Vasco da Gama","Ferdinand Magellan","Marco Polo"],a:0,e:"Columbus believed he had reached Asia (the 'Indies') when he arrived in the Caribbean in 1492 — a classic case of thinking the journey was 'done' when it wasn't."},
  {id:2,s:'hist',q:"Which great wall, built over many centuries, is an example of a 'journey of construction' that was never truly finished?",o:["Hadrian's Wall","The Great Wall of China","The Berlin Wall","The Aurelian Wall"],a:1,e:"The Great Wall of China was built, extended, and rebuilt over roughly 2,000 years by multiple dynasties — a journey that arguably never had a final destination."},
  {id:3,s:'hist',q:"The Moon landing in 1969 was seen as humanity 'getting there.' Which country achieved this milestone first?",o:["Soviet Union","France","United States","United Kingdom"],a:2,e:"NASA's Apollo 11 mission in July 1969 landed Neil Armstrong and Buzz Aldrin on the Moon — a destination humans had dreamed of for centuries."},
  {id:4,s:'hist',q:"The abolition of slavery in the USA (1865) was one step in a long journey. Which amendment to the US Constitution abolished it?",o:["13th Amendment","14th Amendment","15th Amendment","12th Amendment"],a:0,e:"The 13th Amendment, ratified in December 1865, formally abolished slavery throughout the United States."},
  {id:5,s:'hist',q:"India's independence in 1947 ended a journey of how many years of British colonial rule (approximately)?",o:["100 years","150 years","200 years","250 years"],a:2,e:"British rule over India is generally counted from around 1757 (Battle of Plassey) to 1947, making it roughly 190 years — commonly rounded to 200 years."},
  {id:6,s:'hist',q:"The fall of the Berlin Wall in 1989 marked the 'arrival' of reunification for which country?",o:["Poland","East & West Germany","Soviet Union","Czechoslovakia"],a:1,e:"The Berlin Wall fell on November 9, 1989, symbolizing the end of division between East and West Germany, which formally reunified on October 3, 1990."},
  {id:7,s:'hist',q:"Which civilization built the most famous road system of the ancient world, focused on 'getting there' efficiently?",o:["Ancient Egypt","Roman Empire","Indus Valley Civilization","Persian Empire"],a:1,e:"The Romans built over 400,000 km of roads to efficiently connect and control their empire — 'all roads lead to Rome.'"},
  {id:8,s:'hist',q:"The Silk Road was a journey of trade between China and Europe. Roughly how long was this ancient trade route?",o:["2,000 km","4,000 km","7,000 km","12,000 km"],a:2,e:"The Silk Road stretched approximately 6,400–7,000 km connecting China to the Mediterranean world, facilitating trade in silk, spices, and ideas."},
  {id:9,s:'hist',q:"Gandhi's Salt March in 1930 was a journey of protest covering about how many kilometres?",o:["100 km","200 km","385 km","600 km"],a:2,e:"Gandhi's Dandi March covered about 385 km from Sabarmati Ashram to Dandi, challenging British salt taxes and inspiring millions."},
  {id:10,s:'hist',q:"Which space race milestone made the Soviet Union the first to 'get there' in 1957?",o:["First human in space","First satellite — Sputnik","First spacewalk","First moon rover"],a:1,e:"Sputnik 1, launched on October 4, 1957, was the first artificial satellite to orbit Earth — shocking the world and launching the space race."},

  // SCIENCE & TECH
  {id:11,s:'sci',q:"Which planet do scientists most actively discuss as the next great 'destination' for human space exploration?",o:["Venus","Jupiter","Mars","Saturn"],a:2,e:"Mars is the primary target for future human missions, discussed by NASA, SpaceX, and other agencies as the next major destination beyond the Moon."},
  {id:12,s:'sci',q:"Electric vehicles (EVs) are seen as a destination for transport. Which gas do they help reduce in the atmosphere?",o:["Oxygen","Carbon dioxide","Nitrogen","Hydrogen"],a:1,e:"EVs produce no tailpipe emissions, helping reduce carbon dioxide (CO₂), a key greenhouse gas driving climate change."},
  {id:13,s:'sci',q:"Where did modern humans (Homo sapiens) first appear, according to fossil and genetic evidence?",o:["200,000 years ago in Africa","50,000 years ago in Europe","1 million years ago in Asia","500,000 years ago in Australia"],a:0,e:"Fossil and genetic evidence points to Homo sapiens first appearing around 200,000–300,000 years ago in Africa."},
  {id:14,s:'sci',q:"The internet began as a US military/research network. What was it originally called?",o:["WorldNet","ARPANET","CompuServe","WebNet"],a:1,e:"ARPANET (Advanced Research Projects Agency Network), developed in the late 1960s, was the precursor to today's internet."},
  {id:15,s:'sci',q:"Scientists talk about 'climate tipping points.' What does this mean?",o:["The exact temperature where all ice melts","A threshold beyond which changes become irreversible","The point where fossil fuels run out","The moment humans stop pollution"],a:1,e:"Tipping points are thresholds in the climate system that, once crossed, trigger self-reinforcing changes that are very difficult or impossible to reverse."},
  {id:16,s:'sci',q:"Which game did AI first famously beat a world champion in, in 1997?",o:["Go","Chess","Checkers","Poker"],a:1,e:"IBM's Deep Blue defeated world chess champion Garry Kasparov in 1997, marking a landmark moment in AI history."},
  {id:17,s:'sci',q:"What is the medical term for vaccines 'training' the immune system before illness?",o:["Mutation","Immunization","Photosynthesis","Osmosis"],a:1,e:"Immunization describes the process by which vaccines train the immune system to recognize and fight pathogens before actual infection occurs."},
  {id:18,s:'sci',q:"The James Webb Space Telescope (launched 2021) is positioned where in space?",o:["Low Earth Orbit","The Moon","Lagrange Point 2 (1.5M km from Earth)","Mars orbit"],a:2,e:"JWST is positioned at Lagrange Point 2, about 1.5 million km from Earth, where it has a clear, stable view of the universe."},
  {id:19,s:'sci',q:"Which renewable energy source converts sunlight directly into electricity?",o:["Wind turbine","Hydroelectric dam","Solar photovoltaic panel","Geothermal plant"],a:2,e:"Solar photovoltaic (PV) panels convert sunlight directly into electricity using the photovoltaic effect."},
  {id:20,s:'sci',q:"In computing, what does 'AI' stand for?",o:["Automated Integration","Artificial Intelligence","Advanced Internet","Algorithmic Input"],a:1,e:"AI stands for Artificial Intelligence — the simulation of human intelligence processes by computer systems."},

  // LITERATURE & MEDIA
  {id:21,s:'lit',q:"Which famous novel begins with a long symbolic journey aboard a ship called the Pequod?",o:["Treasure Island","Moby-Dick","Robinson Crusoe","The Old Man and the Sea"],a:1,e:"Herman Melville's 'Moby-Dick' (1851) follows Captain Ahab's obsessive voyage to hunt the white whale — a classic journey with an uncertain destination."},
  {id:22,s:'lit',q:"In Roald Dahl's 'Charlie and the Chocolate Factory,' Charlie's story follows which classic narrative structure?",o:["Tragedy","Bildungsroman","Hero's Journey","Satire"],a:2,e:"The Hero's Journey describes a story where a hero goes on an adventure, faces challenges, and returns transformed — perfectly fitting Charlie's arc."},
  {id:23,s:'lit',q:"'The Wizard of Oz' is literally and metaphorically about a journey. What is Dorothy's destination?",o:["The Emerald City","Home in Kansas","The Yellow Brick Road","The Poppy Field"],a:0,e:"Dorothy's goal is to reach the Emerald City and find the Wizard who she hopes can send her back home to Kansas."},
  {id:24,s:'lit',q:"Which ancient Greek epic poem follows Odysseus on a 10-year journey home after the Trojan War?",o:["The Iliad","The Aeneid","The Odyssey","Beowulf"],a:2,e:"Homer's 'The Odyssey' follows Odysseus through 10 years of perilous adventures as he tries to reach home in Ithaca."},
  {id:25,s:'lit',q:"J.R.R. Tolkien's 'The Hobbit' features a quest to reach which location?",o:["Mordor","The Shire","The Lonely Mountain","Rivendell"],a:2,e:"Bilbo Baggins and the dwarves journey to the Lonely Mountain (Erebor) to reclaim the dwarves' homeland from the dragon Smaug."},
  {id:26,s:'lit',q:"In 'Around the World in 80 Days' by Jules Verne, what does Phileas Fogg bet he can do?",o:["Fly across continents","Circumnavigate the globe in 80 days","Sail to the South Pole","Travel to America in 10 days"],a:1,e:"Phileas Fogg bets £20,000 that he can travel around the entire world in just 80 days — the ultimate race where home is the destination."},
  {id:27,s:'lit',q:"Which type of poem often describes a journey or quest and is one of the oldest forms of storytelling?",o:["Haiku","Sonnet","Epic","Limerick"],a:2,e:"Epics are long narrative poems that describe heroic journeys — from Homer's Odyssey to India's Mahabharata."},
  {id:28,s:'lit',q:"In story structure, what is the moment called when the hero is closest to failing before the final victory?",o:["Exposition","Climax","Dark Night of the Soul","Resolution"],a:2,e:"The 'Dark Night of the Soul' is the beat where everything seems hopeless before the hero finds renewed strength to reach their goal."},
  {id:29,s:'lit',q:"Which literary device makes a journey represent a deeper idea (e.g., life, growth)?",o:["Simile","Alliteration","Metaphor","Onomatopoeia"],a:2,e:"A metaphor directly represents one thing as another — a journey can be a metaphor for life, growth, or the pursuit of a goal."},
  {id:30,s:'lit',q:"Which Indian epic features the Pandavas on a long exile journey of 13 years before their great battle?",o:["Ramayana","Mahabharata","Panchatantra","Arthashastra"],a:1,e:"In the Mahabharata, the Pandavas spend 12 years in forest exile and 1 year in hiding before returning to reclaim their kingdom at Kurukshetra."},

  // SOCIAL STUDIES
  {id:31,s:'soc',q:"The United Nations' Sustainable Development Goals (SDGs) aim to be achieved by which year?",o:["2025","2030","2040","2050"],a:1,e:"The 17 SDGs were adopted in 2015 as part of the 2030 Agenda for Sustainable Development, with 2030 as the target year."},
  {id:32,s:'soc',q:"Which global index, published annually, measures the gender gap across countries?",o:["HDI","WEF Global Gender Gap Index","GINI Coefficient","Freedom Index"],a:1,e:"The World Economic Forum's Global Gender Gap Index annually ranks countries on political participation, economic participation, education, and health parity."},
  {id:33,s:'soc',q:"India's journey toward independence was guided by Gandhi's principle of 'Ahimsa,' which means what?",o:["Armed resistance","Non-violence","Civil disobedience","Economic boycott"],a:1,e:"Ahimsa means non-violence in Sanskrit. Gandhi elevated it into a political strategy, believing freedom could only be won through peaceful resistance."},
  {id:34,s:'soc',q:"The Paris Agreement (2015) set a goal to limit global warming to how many degrees Celsius above pre-industrial levels?",o:["1°C","1.5°C","2°C","3°C"],a:1,e:"The Paris Agreement aims to limit warming to well below 2°C, with efforts to limit it to 1.5°C — a destination humanity is still racing toward."},
  {id:35,s:'soc',q:"Which organization, founded in 1945 after World War II, represents the world's journey toward international peace?",o:["NATO","World Trade Organization","United Nations","European Union"],a:2,e:"The United Nations was founded on October 24, 1945, with the goal of maintaining international peace and security."},
  {id:36,s:'soc',q:"What term describes people forced to flee their homes due to conflict or persecution?",o:["Immigrants","Tourists","Refugees","Expats"],a:2,e:"Refugees are people who flee their home countries due to conflict or persecution, as defined by the 1951 Refugee Convention."},
  {id:37,s:'soc',q:"India's Constitution (adopted 1950) abolished untouchability under which article?",o:["Article 14","Article 17","Article 21","Article 32"],a:1,e:"Article 17 of the Indian Constitution abolishes 'untouchability' and forbids its practice in any form — a landmark in India's social justice journey."},
  {id:38,s:'soc',q:"The term 'digital divide' refers to which global challenge?",o:["Too many social media platforms","Unequal access to technology and the internet","Cyberbullying","Digital addiction"],a:1,e:"The digital divide describes the gap between people who have access to modern technology and the internet and those who don't."},
  {id:39,s:'soc',q:"Which economic concept measures the total value of all goods and services a country produces in a year?",o:["Inflation","GDP (Gross Domestic Product)","Trade deficit","Interest rate"],a:1,e:"GDP (Gross Domestic Product) measures the total monetary value of all finished goods and services produced within a country in a specific time period."},
  {id:40,s:'soc',q:"Which UN document specifically protects children's rights, including education, health, and protection?",o:["Universal Declaration of Human Rights","UN Convention on the Rights of the Child","Geneva Convention","Kyoto Protocol"],a:1,e:"The UN Convention on the Rights of the Child (1989) is the most widely ratified human rights treaty, guaranteeing children's rights globally."},

  // ART & MUSIC
  {id:41,s:'art',q:"Which famous painting by Claude Monet is often seen as the birth of Impressionism?",o:["Starry Night","Impression, Sunrise","Water Lilies","The Scream"],a:1,e:"Monet's 'Impression, Sunrise' (1872) gave the Impressionist movement its name — launching an art revolution focused on capturing light and movement."},
  {id:42,s:'art',q:"Which Beethoven symphony journeys from tension to triumph, ending with the famous 'Ode to Joy'?",o:["Symphony No. 3 'Eroica'","Symphony No. 5","Symphony No. 9 'Choral'","Symphony No. 6 'Pastoral'"],a:2,e:"Beethoven's Symphony No. 9 (1824), composed while he was deaf, journeys from darkness to the joyful 'Ode to Joy' finale — a triumph of human spirit."},
  {id:43,s:'art',q:"Indian classical music uses 'ragas.' How many main (janaka) ragas are there traditionally?",o:["6","10","12","20"],a:0,e:"There are traditionally 6 main ragas in Indian classical music, each with many derivative 'raginis.'"},
  {id:44,s:'art',q:"Which architectural wonder in Agra represents a 'journey of love' and took 22 years to build?",o:["Red Fort","Qutb Minar","Taj Mahal","Hawa Mahal"],a:2,e:"The Taj Mahal was built by Emperor Shah Jahan over 22 years (1632–1653) as a mausoleum for his beloved wife Mumtaz Mahal."},
  {id:45,s:'art',q:"Which anonymous British artist made street art and graffiti globally famous?",o:["Pablo Picasso","Andy Warhol","Banksy","Jackson Pollock"],a:2,e:"Banksy brought politically charged graffiti and street art to global attention, blurring lines between 'high art' and public expression."},
  {id:46,s:'art',q:"Which Indian classical dance form tells stories through hand gestures called 'mudras'?",o:["Flamenco","Kathak","Bharatanatyam","Ballet"],a:2,e:"Bharatanatyam uses intricate hand gestures (mudras), facial expressions, and footwork to tell stories from Hindu mythology."},
  {id:47,s:'art',q:"Which Disney film (1994) was a landmark in combining hand-drawn animation with CGI backgrounds?",o:["Beauty and the Beast","The Lion King","Aladdin","Mulan"],a:1,e:"The Lion King (1994) used CGI for the wildebeest stampede while keeping traditional hand-drawn animation for characters — a landmark hybrid."},
  {id:48,s:'art',q:"Who is credited with taking the first permanent photograph, around 1826?",o:["Louis Daguerre","Joseph Nicéphore Niépce","Ansel Adams","Henry Fox Talbot"],a:1,e:"Joseph Nicéphore Niépce created the oldest surviving photograph, 'View from the Window at Le Gras,' around 1826–27, using an 8-hour exposure."},
  {id:49,s:'art',q:"Which music genre, born in the southern USA, journeys from sorrow to hope?",o:["Classical","Jazz","Blues","Pop"],a:2,e:"Blues music, originating with African Americans in the Deep South, expresses personal hardship, loss, and hope — a musical journey through suffering toward resilience."},
  {id:50,s:'art',q:"Approximately how many films does India's film industry produce annually — more than any other country?",o:["500","1,000","1,500","2,000"],a:3,e:"India's film industry (Bollywood + regional cinemas) produces approximately 1,500–2,000 films per year, making it the world's most prolific film producer."},

  // SPECIAL AREA
  {id:51,s:'spec',q:"The concept of 'growth mindset' vs. 'fixed mindset' was developed by which researcher?",o:["Sigmund Freud","Carol Dweck","Abraham Maslow","Carl Jung"],a:1,e:"Stanford psychologist Carol Dweck developed the Growth vs. Fixed Mindset theory, showing that believing abilities can develop leads to greater resilience."},
  {id:52,s:'spec',q:"Maslow's Hierarchy of Needs describes a journey toward which ultimate human state at the top of the pyramid?",o:["Safety","Love","Esteem","Self-Actualization"],a:3,e:"Maslow's pyramid ends at 'Self-Actualization' — the realization of one's full potential. Most humans are perpetually 'on the way there.'"},
  {id:53,s:'spec',q:"Which term describes the in-between state — neither at the start nor the destination — like adolescence or an unfinished project?",o:["Stasis","Liminality","Entropy","Equilibrium"],a:1,e:"'Liminality' (from Latin 'limen' = threshold) describes transitional in-between states central to the 'Are We There Yet?' theme."},
  {id:54,s:'spec',q:"Which philosopher is most associated with the idea that the journey matters more than the destination?",o:["Aristotle","Ralph Waldo Emerson","Plato","Immanuel Kant"],a:1,e:"The sentiment is most attributed to Ralph Waldo Emerson (1803–1882), echoing broader philosophical traditions about valuing process over outcome."},
  {id:55,s:'spec',q:"Which term describes designing products to become outdated so consumers keep buying new ones?",o:["Mass production","Planned obsolescence","Capitalism","Consumerism"],a:1,e:"'Planned obsolescence,' proposed by Bernard London in 1932, describes designing products to wear out and be replaced, keeping the consumption journey going."},
  {id:56,s:'spec',q:"The 'progress trap' suggests that sometimes 'getting there' creates new problems. Which is a classic example?",o:["Agriculture enabling population growth that strained resources","Inventing the wheel","Creating fire","Building the Eiffel Tower"],a:0,e:"The 'progress trap' describes how solving one problem creates new ones — e.g., agriculture fed more people but also led to deforestation, inequality, and disease."},
  {id:57,s:'spec',q:"Which Indian concept from the Bhagavad Gita teaches performing one's duty without attachment to outcomes?",o:["Karma","Dharma","Nishkama Karma","Moksha"],a:2,e:"'Nishkama Karma' teaches performing duty without attachment to results — a philosophical answer to 'Are we there yet?': focus on the journey, not arrival."},

let answered = 0, correct = 0, currentSubj = 'all';
const state = {};

function updateScore() {
  document.getElementById('scoreVal').textContent = correct + ' / ' + answered;
  const pct = answered > 0 ? Math.round((correct / answered) * 100) : 0;
  document.getElementById('progressFill').style.width = pct + '%';
  document.getElementById('accVal').textContent = answered > 0 ? pct + '%' : '—';
}

function resetAll() {
  answered = 0; correct = 0;
  Object.keys(state).forEach(k => delete state[k]);
  renderQuestions();
  updateScore();
}

function renderTabs() {
  document.getElementById('tabBar').innerHTML = SUBJECTS.map(s =>
    `<button class="tab${s.id===currentSubj?' active':''}" onclick="switchTab('${s.id}')">${s.label}</button>`
  ).join('');
}

function switchTab(id) { currentSubj = id; renderTabs(); renderQuestions(); }

function renderQuestions() {
  const filtered = currentSubj === 'all' ? QS : QS.filter(q => q.s === currentSubj);
  let html = '';
  if (currentSubj === 'all') {
    html += `<div class="tip-box"><strong>Quick tips for tomorrow:</strong> WSC questions reward understanding over memorization. Read each option carefully — two may seem correct. Always attempt every question — no negative marking. Think about how each topic connects back to the big question: <em>Are We There Yet?</em> Good luck in Gurugram!</div>`;
  }
  const groups = {};
  filtered.forEach(q => { if (!groups[q.s]) groups[q.s]=[]; groups[q.s].push(q); });
  Object.keys(groups).forEach(subj => {
    if (currentSubj === 'all') html += `<div class="section-heading">${SUBJ_STYLE[subj].name}</div>`;
    groups[subj].forEach(q => {
      html += `<div class="q-block" id="qb${q.id}">
        <div class="q-meta">
          <span class="q-num">Q${q.id}</span>
          <span class="q-subj-tag" style="${SUBJ_STYLE[q.s].tag}">${SUBJ_STYLE[q.s].name}</span>
        </div>
        <div class="q-text">${q.q}</div>
        <div class="options" id="opts${q.id}">
          ${q.o.map((opt,i)=>`<button class="opt" id="opt${q.id}_${i}" onclick="choose(${q.id},${i})">${String.fromCharCode(65+i)}. ${opt}</button>`).join('')}
        </div>
        <div class="explanation" id="exp${q.id}">${q.e}</div>
      </div>`;
    });
  });
  document.getElementById('content').innerHTML = html;
  Object.keys(state).forEach(qid => {
    const {chosen, wasCorrect, q} = state[qid];
    applyResult(parseInt(qid), chosen, q.a, wasCorrect);
  });
}

function choose(qid, chosen) {
  if (state[qid]) return;
  const q = QS.find(x => x.id === qid);
  const wasCorrect = chosen === q.a;
  if (wasCorrect) correct++;
  answered++;
  state[qid] = {chosen, wasCorrect, q};
  applyResult(qid, chosen, q.a, wasCorrect);
  document.getElementById('exp'+qid).style.display = 'block';
  updateScore();
}

function applyResult(qid, chosen, ans, wasCorrect) {
  const opts = document.querySelectorAll(`#opts${qid} .opt`);
  opts.forEach((el, i) => {
    el.disabled = true;
    if (i === ans) el.classList.add(wasCorrect && i === chosen ? 'correct' : 'reveal');
    else if (i === chosen && !wasCorrect) el.classList.add('wrong');
  });
  const expEl = document.getElementById('exp'+qid);
  if (expEl) expEl.style.display = 'block';
}

renderTabs();
renderQuestions();
updateScore();
</script>
